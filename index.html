<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IRCTC Redesign</title>

    <link rel="stylesheet" href="CSS/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <!-- Header Section -->
    <header>

        <nav class="navbar">

            <div class="logo">
                <i class="fa-solid fa-train"></i>
                IRCTC
            </div>

            <ul class="nav-links">

                <li><a href="#">Home</a></li>
                <li><a href="#">Book Ticket</a></li>
                <li><a href="#">Train Status</a></li>
                <li><a href="#">My Bookings</a></li>

            </ul>

            <button class="login-btn">
                Login
            </button>

        </nav>

    </header>
    <!-- Hero section  -->
    <section class="hero">

        <div class="hero-content">

            <h1>Travel Across India with Ease</h1>

            <p>
                Search trains, compare classes, and book your journey
                through a clean and modern interface.
            </p>

            <button class="hero-btn">Book Ticket</button>

        </div>

        <div class="hero-image">

            <img src="https://img.magnific.com/free-psd/modern-highspeed-train-tracks-orange-white-design-sleek-fast-transportation_191095-84830.jpg" alt="Modern Train">

        </div>

    </section>

    
    <script src="js/script.js"></script>

</body>

</html>
